<!DOCTYPE html>
<html>
<head>
<title>Spell Supplies Catalog</title>

<style>
body {
    margin: 0;
    color: gold;
    font-family: "Times New Roman";
    text-align: center;
    padding: 40px;

    background-image: url("https://i.pinimg.com/originals/ae/bf/44/aebf440644c1232bc35440a3484dda9b.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: -1;
}

.home-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 8px 18px;
    background: gold;
    border: none;
    cursor: pointer;
    font-weight: bold;
    z-index: 10;
}

.product-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 40px;
    padding: 60px;
}

/* 🔥 RELIABLE DARK MARBLE (no external texture) */
.product-card {
    height: 220px;
    border: 4px solid gold;
    position: relative;
    transition: 0.3s;
    overflow: hidden;

    background-color: #1a1a1a;
    background-image:
        linear-gradient(135deg, rgba(0,0,0,0.6), rgba(0,0,0,0.4)),
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.08), transparent 55%),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,0.06), transparent 60%),
        repeating-linear-gradient(
            115deg,
            rgba(255,255,255,0.05) 0px,
            rgba(255,255,255,0.05) 2px,
            transparent 8px,
            transparent 18px
        );

    background-blend-mode: multiply, screen, screen, normal;
    box-shadow: 0 0 15px gold;
}

/* subtle shine */
.product-card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, rgba(255,255,255,0.08), transparent 45%);
    pointer-events: none;
}
</style>
</head>

<body>

<button class="home-btn"
onclick="window.location.href='shop.html'">
Back to Shop
</button>

<h1>Spell Supplies — Full Catalog</h1>

<div class="product-grid">
  <div class="product-card"></div>
  <div class="product-card"></div>
  <div class="product-card"></div>
  <div class="product-card"></div>
</div>

</body>
</html>


</body>
</html>

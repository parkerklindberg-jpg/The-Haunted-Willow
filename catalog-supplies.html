<!DOCTYPE html>
<html>
<head>
<title>Spell Supplies Catalog | The Haunted Willow</title>

<style>

body {
    margin: 0;
    color: gold;
    font-family: "Times New Roman";
    text-align: center;
    padding: 40px;

    background-image: url("https://i.pinimg.com/originals/ae/bf/44/aebf440644c1232bc35440a3484dda9b.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: -1;
}

/* 🔙 back button */
.home-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 8px 18px;
    background: gold;
    border: none;
    cursor: pointer;
    font-weight: bold;
    z-index: 10;
}

.home-btn:hover {
    background: #e6c200;
}

/* title */
.page-title {
    color: gold;
    text-shadow: 0 0 12px #7cff9b;
}

/* grid */
.product-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 40px;
    padding: 40px 60px;
}

/* wrapper */
.product-card {
    text-align: center;
}

/* marble product box */
.product-box {
    height: 220px;
    border: 4px solid gold;
    border-bottom: none;
    transition: 0.3s ease;
    overflow: hidden;

    background-color: #ece8e1;
    background-image:
        linear-gradient(135deg, rgba(255,255,255,0.9), rgba(230,230,230,0.9)),
        radial-gradient(circle at 20% 30%, rgba(0,0,0,0.06), transparent 55%),
        radial-gradient(circle at 80% 70%, rgba(0,0,0,0.05), transparent 60%),
        repeating-linear-gradient(
            115deg,
            rgba(0,0,0,0.04) 0px,
            rgba(0,0,0,0.04) 2px,
            transparent 8px,
            transparent 18px
        );

    background-blend-mode: normal, multiply, multiply, normal;
    box-shadow: 0 0 15px gold;
}

.product-box:hover {
    transform: translateY(-6px);
    box-shadow: 0 0 25px #7cff9b;
}

/* info panel */
.product-info {
    border: 4px solid gold;
    border-top: 3px solid gold;
    background: rgba(0,0,0,0.55);
    padding: 10px 6px 14px;
}

/* name */
.product-name {
    font-weight: bold;
    color: gold;
    font-size: 15px;
}

/* price */
.price {
    margin-top: 4px;
    color: #e6d79c;
    font-weight: bold;
}

</style>
</head>

<body>

<button class="home-btn"
onclick="window.location.href='shop.html'">
Back to Shop
</button>

<h1 class="page-title">Spell Supplies — Full Catalog</h1>
<p>Essential tools for your magical workings.</p>

<div class="product-grid">

  <div class="product-card">
    <div class="product-box"></div>
    <div class="product-info">
      <div class="product-name">White Ritual Candles</div>
      <div class="price">$8.00</div>
    </div>
  </div>

  <div class="product-card">
    <div class="product-box"></div>
    <div class="product-info">
      <div class="product-name">Black Protection Candles</div>
      <div class="price">$8.00</div>
    </div>
  </div>

  <div class="product-card">
    <div class="product-box"></div>
    <div class="product-info">
      <div class="product-name">Loose Incense Blend</div>
      <div class="price">$9.00</div>
    </div>
  </div>

  <div class="product-card">
    <div class="product-box"></div>
    <div class="product-info">
      <div class="product-name">Charcoal Discs (10 pack)</div>
      <div class="price">$6.00</div>
    </div>
  </div>

  <!-- second row -->

  <div class="product-card">
    <div class="product-box"></div>
    <div class="product-info">
      <div class="product-name">Spell Jar Kit</div>
      <div class="price">$10.00</div>
    </div>
  </div>

  <div class="product-card">
    <div class="product-box"></div>
    <div class="product-info">
      <div class="product-name">Herbal Starter Bundle</div>
      <div class="price">$14.00</div>
    </div>
  </div>

  <div class="product-card">
    <div class="product-box"></div>
    <div class="product-info">
      <div class="product-name">Mini Altar Cloth</div>
      <div class="price">$12.00</div>
    </div>
  </div>

  <div class="product-card">
    <div class="product-box"></div>
    <div class="product-info">
      <div class="product-name">Protection Sachet</div>
      <div class="price">$7.00</div>
    </div>
  </div>

</div>

</body>
</html>



</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Spell Oils Catalog</title>

<style>
body {
    margin: 0;
    color: gold;
    font-family: "Times New Roman";
    text-align: center;
    padding: 40px;

    background-image: url("https://i.pinimg.com/originals/ae/bf/44/aebf440644c1232bc35440a3484dda9b.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: -1;
}

.home-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 8px 18px;
    background: gold;
    border: none;
    cursor: pointer;
    font-weight: bold;
    z-index: 10;
}

.product-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 40px;
    padding: 60px;
}

.product-card {
    height: 220px;
    border: 4px solid gold;

    /* 🌑 DARK MARBLE LOOK */
    background:
        linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
        url("https://www.transparenttextures.com/patterns/dark-marble.png");

    background-size: cover;
    background-position: center;

    box-shadow: 0 0 15px gold;
    position: relative;
    transition: 0.3s;
    overflow: hidden;
}

}
</style>
</head>

<body>

<button class="home-btn"
onclick="window.location.href='shop.html'">
Back to Shop
</button>

<h1>Spell Oils — Full Catalog</h1>

<div class="product-grid">
  <div class="product-card"></div>
  <div class="product-card"></div>
  <div class="product-card"></div>
  <div class="product-card"></div>
</div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Shop | The Haunted Willow</title>

<style>

body {
    margin: 0;
    color: gold;
    font-family: "Times New Roman";
    text-align: center;
    padding: 40px;

    /* 🌲 haunted forest background */
    background-image: url("https://i.pinimg.com/originals/ae/bf/44/aebf440644c1232bc35440a3484dda9b.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

/* dark overlay */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: -1;
}

/* CATEGORY TITLES */
.category-title {
    margin-top: 80px;
    color: gold;
    text-shadow: 0 0 12px #7cff9b;
}

/* PRODUCT GRID — 4 in a straight line */
.product-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 40px;
    padding: 40px 60px;
}

/* GOLD PRODUCT BOX */
.product-card {
    height: 220px;
    border: 4px solid gold;
    background: rgba(0,0,0,0.4);
    box-shadow: 0 0 15px gold;
    position: relative;
    transition: 0.3s;
}

/* HOVER LIFT */
.product-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 0 25px #7cff9b;
}

/* PRICE TEXT */
.price {
    position: absolute;
    bottom: -28px;
    width: 100%;
    text-align: center;
    color: #e6d79c;
    font-weight: bold;
}

/* VIEW CATALOG BUTTON */
.catalog-btn {
    margin-top: 40px;
    padding: 10px 24px;
    background: gold;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

.catalog-btn:hover {
    background: #e6c200;
}

</style>
</head>

<body>

<h1>Supplies and Services</h1>
<p>Select from our offerings below.</p>

<h2 class="category-title">Spell Oils</h2>

<div class="product-grid">
  <div class="product-card"><div class="price">$12.00</div></div>
  <div class="product-card"><div class="price">$12.00</div></div>
  <div class="product-card"><div class="price">$12.00</div></div>
  <div class="product-card"><div class="price">$12.00</div></div>
</div>

<button class="catalog-btn"
onclick="window.location.href='catalog-oils.html'">
View Full Catalog
</button>

<h2 class="category-title">Spell Supplies</h2>

<div class="product-grid">
  <div class="product-card"><div class="price">$8.00</div></div>
  <div class="product-card"><div class="price">$8.00</div></div>
  <div class="product-card"><div class="price">$8.00</div></div>
  <div class="product-card"><div class="price">$8.00</div></div>
</div>

<button class="catalog-btn"
onclick="window.location.href='catalog-supplies.html'">
View Full Catalog
</button>

<h2 class="category-title">Spell Services</h2>

<div class="product-grid">
  <div class="product-card"><div class="price">$25.00</div></div>
  <div class="product-card"><div class="price">$25.00</div></div>
  <div class="product-card"><div class="price">$25.00</div></div>
  <div class="product-card"><div class="price">$25.00</div></div>
</div>

<button class="catalog-btn"
onclick="window.location.href='catalog-services.html'">
View Full Catalog
</button>

</body>
</html>

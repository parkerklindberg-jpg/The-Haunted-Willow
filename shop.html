<!DOCTYPE html>
<html>
<head>
<title>Shop | The Haunted Willow</title>

<style>

body {
    margin: 0;
    color: gold;
    font-family: "Times New Roman";
    text-align: center;
    padding: 40px;

    background-image: url("https://i.pinimg.com/originals/ae/bf/44/aebf440644c1232bc35440a3484dda9b.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: -1;
}

/* 🔥 top-right home button */
.home-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 8px 18px;
    background: gold;
    border: none;
    cursor: pointer;
    font-weight: bold;
    z-index: 10;
}

.home-btn:hover {
    background: #e6c200;
}

/* category titles */
.category-title {
    margin-top: 80px;
    color: gold;
    text-shadow: 0 0 12px #7cff9b;
}

/* grid layout */
.product-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 40px;
    padding: 40px 60px;
}

/* 🔥 FIXED premium marble card */
.product-card {
    height: 220px;
    border: 4px solid gold;
    position: relative;
    transition: 0.3s ease;
    overflow: hidden;

    /* reliable dark marble */
    background-color: #1a1a1a;
    background-image:
        linear-gradient(135deg, rgba(0,0,0,0.6), rgba(0,0,0,0.4)),
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.08), transparent 55%),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,0.06), transparent 60%),
        repeating-linear-gradient(
            115deg,
            rgba(255,255,255,0.05) 0px,
            rgba(255,255,255,0.05) 2px,
            transparent 8px,
            transparent 18px
        );

    background-blend-mode: multiply, screen, screen, normal;
    box-shadow: 0 0 15px gold;
}

/* ✨ hover glow */
.product-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 0 25px #7cff9b;
}

/* subtle shine */
.product-card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, rgba(255,255,255,0.08), transparent 45%);
    pointer-events: none;
}

/* price text */
.price {
    position: absolute;
    bottom: -28px;
    width: 100%;
    text-align: center;
    color: #e6d79c;
    font-weight: bold;
}

/* catalog buttons */
.catalog-btn {
    margin-top: 40px;
    padding: 10px 24px;
    background: gold;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

.catalog-btn:hover {
    background: #e6c200;
}

</style>
</head>

<body>

<button class="home-btn"
onclick="window.location.href='index.html'">
Return Home
</button>

<h1>Supplies and Services</h1>
<p>Select from our offerings below.</p>

<h2 class="category-title">Spell Oils</h2>

<div class="product-grid">
  <div class="product-card"><div class="price">$12.00</div></div>
  <div class="product-card"><div class="price">$12.00</div></div>
  <div class="product-card"><div class="price">$12.00</div></div>
  <div class="product-card"><div class="price">$12.00</div></div>
</div>

<button class="catalog-btn"
onclick="window.location.href='catalog-oils.html'">
View Full Catalog
</button>

<h2 class="category-title">Spell Supplies</h2>

<div class="product-grid">
  <div class="product-card"><div class="price">$8.00</div></div>
  <div class="product-card"><div class="price">$8.00</div></div>
  <div class="product-card"><div class="price">$8.00</div></div>
  <div class="product-card"><div class="price">$8.00</div></div>
</div>

<button class="catalog-btn"
onclick="window.location.href='catalog-supplies.html'">
View Full Catalog
</button>

<h2 class="category-title">Spell Services</h2>

<div class="product-grid">
  <div class="product-card"><div class="price">$25.00</div></div>
  <div class="product-card"><div class="price">$25.00</div></div>
  <div class="product-card"><div class="price">$25.00</div></div>
  <div class="product-card"><div class="price">$25.00</div></div>
</div>

<button class="catalog-btn"
onclick="window.location.href='catalog-services.html'">
View Full Catalog
</button>

</body>
</html>

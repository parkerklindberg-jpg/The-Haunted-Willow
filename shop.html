<!DOCTYPE html>
<html>
<head>
<link rel="icon" type="image/png"
href="https://i.pinimg.com/736x/ae/bf/44/aebf440644c1232bc35440a3484dda9b.jpg">

<title>Shop | The Haunted Willow</title>

<style>

body {
    margin: 0;
    color: gold;
    font-family: "Times New Roman";
    text-align: center;
    padding: 40px;
    background-image: url("https://i.pinimg.com/originals/ae/bf/44/aebf440644c1232bc35440a3484dda9b.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: -1;
}

/* home button */
.home-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 8px 18px;
    background: gold;
    border: none;
    cursor: pointer;
    font-weight: bold;
    z-index: 10;
}

.home-btn:hover {
    background: #e6c200;
}

/* cart button */
.cart-btn {
    position: fixed;
    top: 20px;
    right: 160px;
    padding: 8px 18px;
    background: gold;
    border: none;
    cursor: pointer;
    font-weight: bold;
    z-index: 10;
}

.cart-btn:hover {
    background: #e6c200;
}

/* titles */
.category-title {
    margin-top: 80px;
    color: gold;
    text-shadow: 0 0 12px #7cff9b;
}

/* grid */
.product-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 40px;
    padding: 40px 60px;
}

/* wrapper */
.product-card {
    text-align: center;
}

/* marble image box */
.product-box {
    height: 220px;
    border: 4px solid gold;
    border-bottom: none;
    transition: 0.3s ease;
    overflow: hidden;
    cursor: default;
    background-color: #ece8e1;
    box-shadow: 0 0 15px gold;
}

.product-box:hover {
    transform: translateY(-6px);
    box-shadow: 0 0 25px #7cff9b;
}

/* info panel */
.product-info {
    border: 4px solid gold;
    border-top: 3px solid gold;
    background: rgba(0,0,0,0.55);
    padding: 10px 6px 14px;
}

.product-name {
    font-weight: bold;
    color: gold;
    font-size: 15px;
}

.price {
    margin-top: 4px;
    color: #e6d79c;
    font-weight: bold;
}

.catalog-btn {
    margin-top: 40px;
    padding: 10px 24px;
    background: gold;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

.catalog-btn:hover {
    background: #e6c200;
}

/* 🌑 PRODUCT MODAL */
.product-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 9999;
    justify-content: center;
    align-items: center;
}

.modal-box {
    width: 900px;
    max-width: 92%;
    background: rgba(0,0,0,0.9);
    border: 4px solid gold;
    box-shadow: 0 0 40px gold;
    padding: 30px;
    position: relative;
}

.modal-content {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 30px;
    align-items: start;
}

.modal-image {
    height: 320px;
    border: 3px solid gold;
    background-size: cover;
    background-position: center;
}

.modal-description {
    border: 3px solid gold;
    padding: 18px;
    text-align: left;
    color: #e6d79c;
    min-height: 220px;
}

.modal-buttons {
    margin-top: 25px;
    display: flex;
    gap: 16px;
    justify-content: center;
}

.modal-btn {
    padding: 10px 22px;
    background: gold;
    border: none;
    font-weight: bold;
    cursor: pointer;
}

.modal-btn:hover {
    background: #e6c200;
}

.modal-close {
    position: absolute;
    top: 12px;
    right: 18px;
    color: gold;
    font-size: 22px;
    cursor: pointer;
}

/* quantity selector */
.quantity-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 18px;
}

.qty-btn {
    width: 36px;
    height: 36px;
    background: gold;
    border: none;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    color: black;
}

.qty-btn:hover {
    background: #e6c200;
}

.qty-number {
    width: 48px;
    height: 36px;
    border: 2px solid gold;
    background: white;
    color: black;
    font-weight: bold;
    text-align: center;
    font-family: "Times New Roman";
}

</style>
</head>

<body>

<button class="cart-btn">
🛒 Cart (<span id="cartCount">0</span>)
</button>

<button class="home-btn"
onclick="window.location.href='index.html'">
Return Home
</button>

<h1>Supplies and Services</h1>
<p>Select from our offerings below.</p>

<!-- SPELL OILS -->
<h2 class="category-title">Spell Oils</h2>

<div class="product-grid">

<!-- LOVE OIL -->
<div class="product-card">
  <div class="product-box"
    onclick="openModal(
    'https://raw.githubusercontent.com/parkerklindberg-jpg/The-Haunted-Willow/main/162CF5DA-8AA3-410D-B4C2-7B54F17BBD37.jpeg',
    'Vow; A Love Oil — crafted to attract romance, deepen emotional bonds, and sweeten connections. Best used on candles, petitions, or personal work.',
    'Vow; A Love Oil',
    45
    )"
    style="cursor:pointer; background-image:url('https://raw.githubusercontent.com/parkerklindberg-jpg/The-Haunted-Willow/main/162CF5DA-8AA3-410D-B4C2-7B54F17BBD37.jpeg'); background-size:cover; background-position:center;">
  </div>
  <div class="product-info">
    <div class="product-name">Vow; A Love Oil</div>
    <div class="price">$45.00</div>
  </div>
</div>

<!-- MONEY OIL -->
<div class="product-card">
  <div class="product-box"
    onclick="openModal(
    'https://raw.githubusercontent.com/parkerklindberg-jpg/The-Haunted-Willow/main/19A8AF68-3A6A-4FEB-9429-CB4CAC8CFE41.png',
    'Riches; A Money Oil — designed to draw prosperity, improve financial movement, and open roads to income. Ideal for money work and business workings.',
    'Riches; A Money Oil',
    45
    )"
    style="cursor:pointer; background-image:url('https://raw.githubusercontent.com/parkerklindberg-jpg/The-Haunted-Willow/main/19A8AF68-3A6A-4FEB-9429-CB4CAC8CFE41.png'); background-size:cover; background-position:center;">
  </div>
  <div class="product-info">
    <div class="product-name">Riches; A Money Oil</div>
    <div class="price">$45.00</div>
  </div>
</div>

</div>

<!-- 🌑 MODAL -->
<div id="productModal" class="product-modal">
  <div class="modal-box">
    <div class="modal-close" onclick="closeModal()">✕</div>

    <div class="modal-content">
      <div id="modalImage" class="modal-image"></div>
      <div id="modalDescription" class="modal-description"></div>
    </div>

    <div class="quantity-wrap">
      <button class="qty-btn" onclick="changeQty(-1)">−</button>
      <input id="qtyInput" class="qty-number" type="number" value="1" min="1">
      <button class="qty-btn" onclick="changeQty(1)">+</button>
    </div>

    <div class="modal-buttons">
      <button class="modal-btn">Buy Now</button>
      <button class="modal-btn" onclick="addCurrentToCart()">Add to Cart</button>
    </div>
  </div>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let currentProduct = null;

function updateCartCount() {
  const total = cart.reduce((sum, item) => sum + item.qty, 0);
  document.getElementById("cartCount").innerText = total;
}

function openModal(imgUrl, description, name, price) {
  document.getElementById("productModal").style.display = "flex";
  document.getElementById("modalImage").style.backgroundImage =
    "url('" + imgUrl + "')";
  document.getElementById("modalDescription").innerText = description;
  document.getElementById("qtyInput").value = 1;
  currentProduct = { name, price };
}

function closeModal() {
  document.getElementById("productModal").style.display = "none";
}

function changeQty(amount) {
  const input = document.getElementById("qtyInput");
  let value = parseInt(input.value) || 1;
  value += amount;
  if (value < 1) value = 1;
  input.value = value;
}

function addToCart(name, price, qty = 1) {
  const existing = cart.find(item => item.name === name);
  if (existing) existing.qty += qty;
  else cart.push({ name, price, qty });

  localStorage.setItem("cart", JSON.stringify(cart));
  updateCartCount();
}

function addCurrentToCart() {
  if (!currentProduct) return;
  const qty = parseInt(document.getElementById("qtyInput").value) || 1;
  addToCart(currentProduct.name, currentProduct.price, qty);
}

updateCartCount();
</script>

</body>
</html>
